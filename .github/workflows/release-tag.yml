name: Release tag

# Checks that the version `main` claims has a matching `vX.Y.Z` tag, and fails
# the run when it has not had one for a day (#515).
#
# Pushing that tag is the one manual step left in the release: release-please
# runs with `skip-github-release`, because a tag created with a workflow's
# GITHUB_TOKEN does not trigger other workflows and would never start
# `release.yml`. Until now nothing noticed when the step was forgotten — `main`
# then advertises a version with no GitHub Release and no installers, while the
# control server's update check keeps telling self-hosters they are current.
#
# Daily rather than on `push: [main]`: the tag follows the release PR merge by
# minutes, so a push-triggered run would report the normal flow as a failure.
# The script's grace period covers the same window for the scheduled run.
on:
  schedule:
    # 07:23 UTC — off the hour, to avoid GitHub's scheduling peak.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the release version is tagged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `git tag --list` and the commit date of the version bump both need
          # the full history; the default shallow clone has neither.
          fetch-depth: 0

      # No `npm ci` and no Node setup beyond the runner default: the script
      # reads the committed manifest and shells out to git.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check the release version is tagged
        run: node scripts/check-release-tag.mjs

  # A tag alone proves nothing: the publish matrix may have failed half-way
  # through, never have run for the tag at all (#533), or have left the release
  # as an unpublished draft (#698). Deliberately independent of `check` — the
  # two report different halves of the same pipeline, and one missing tag must
  # not hide a broken release.
  #
  # A job of its own rather than a step of `check`, because it is the only part
  # of this workflow that needs `contents: write`: GitHub lists draft releases
  # only to a token with push access, and a draft is exactly what this check
  # has to be able to see. With `contents: read` the unpublished release of
  # v0.10.5 read as a tag that had produced nothing at all, and the report told
  # the maintainer to re-push the tag. The scripts only read, and the checkout
  # keeps `persist-credentials: false`, so the token never reaches git either.
  assets:
    name: Check the newest tag produced a complete release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      # `ok` | `failed` | `inconclusive` — set by the check step below so the
      # report job can tell a transient GitHub API error (#721) apart from a
      # real failure without treating either as a plain job result.
      outcome: ${{ steps.assets.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version's tag has to be visible to `git tag --list` here too.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # `check-release-assets.mjs` exits 2 rather than 1 when it could not
      # reach the GitHub API even after retrying (#721): a 5xx or a rate limit
      # says nothing about whether the release is broken, so that outcome must
      # not read as the same failure a missing artifact would be. The step
      # itself still succeeds (exit 0) so the job result stays clean; the
      # `outcome` output is how the report job tells the two apart.
      - name: Check the newest tag produced a complete release
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/check-release-assets.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo 'outcome=inconclusive' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo 'outcome=ok' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=failed' >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

  # A failing scheduled run is invisible without this: nobody is emailed about
  # one, so the report goes into the issue tracker instead (#514) — which is
  # also where a forgotten tag belongs.
  report:
    needs: [check, assets]
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-report.yml
    with:
      # A transient GitHub API error must neither file a fresh "workflow
      # failing" report nor quietly close an existing one — the run said
      # nothing about the release either way (#721). `needs.*.result` still
      # covers every job's real result; only the "success" branch is narrowed,
      # so an inconclusive `assets` run falls through to `none` instead.
      result: >-
        ${{ contains(needs.*.result, 'failure') && 'failure'
         || (contains(needs.*.result, 'success')
             && needs.assets.outputs.outcome != 'inconclusive') && 'success'
         || 'none' }}
