version: 2
updates:
  # npm dependencies across the workspace (single root lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # typescript-eslint still caps its TypeScript peer below 6.1, so a
    # TypeScript 7 bump makes `npm ci` fail with ERESOLVE and takes the whole
    # grouped PR down with it. Drop this entry as part of #426.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # Keep GitHub Actions pinned-SHAs current (paired with SHA pinning in workflows).
  # The extra directory covers the local composite action in .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Bundle all action updates into one PR so multi-step actions (e.g. CodeQL
    # init + analyze) always move together and never mismatch versions.
    groups:
      github-actions:
        patterns:
          - '*'
