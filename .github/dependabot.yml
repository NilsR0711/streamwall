version: 2
updates:
  # npm dependencies across the workspace (single root lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Updates a grouped PR cannot carry: because a group is all-or-nothing,
    # one uninstallable member blocks every other update in the same PR.
    ignore:
      # typescript-eslint still caps its TypeScript peer below 6.1, so a
      # TypeScript 7 bump makes `npm ci` fail with ERESOLVE. Drop as part
      # of #426.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Playwright 1.62 resolves tsconfig `extends` only in the tsconfig's own
      # node_modules, which misses our hoisted `@tsconfig/*` bases and kills
      # the E2E job during config load. Drop as part of #691.
      - dependency-name: '@playwright/test'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    # Grouped PRs are all-or-nothing, so a group is split by update-type: a
    # blocked major (see the `ignore` comment above) never holds back the
    # low-risk minor/patch updates that ship alongside it (#690).
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      production-major:
        dependency-type: production
        update-types:
          - major
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-major:
        dependency-type: development
        update-types:
          - major

  # Keep GitHub Actions pinned-SHAs current (paired with SHA pinning in workflows).
  # The extra directory covers the local composite action in .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Bundle all action updates into one PR so multi-step actions (e.g. CodeQL
    # init + analyze) always move together and never mismatch versions.
    groups:
      github-actions:
        patterns:
          - '*'
